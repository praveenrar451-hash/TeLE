<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Insta-Tele App</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- APP WRAPPER -->
    <div class="app-container">

        <!-- 1. LOGIN SCREEN -->
        <div id="login-container" class="app-view active">
            <div class="login-box">
                <h1 class="app-logo-text">InstaTele</h1>
                <p class="app-sub-text">Connect with friends and chat instantly.</p>
                <input type="text" id="username-input" placeholder="Enter unique username" autocomplete="off">
                <button id="login-btn">Log In</button>
                <p id="login-error" class="error-text"></p>
            </div>
        </div>

        <!-- 2. INSTAGRAM FEED SCREEN -->
        <div id="insta-feed-container" class="app-view">
            <header class="top-nav-bar">
                <h2 class="brand-title">InstaTele</h2>
                <div class="top-actions">
                    <i class="fa-brands.fa-telegram infinity-btn" title="Telegram Chat" style="font-size:22px; cursor:pointer;">✈️</i>
                </div>
            </header>
            
            <div class="main-scroll-area" id="feed-posts-area">
                <!-- Dynamic Posts will load here -->
            </div>

            <!-- Bottom Navigation -->
            <nav class="insta-nav">
                <i class="fa-solid fa-house active" data-action="home"></i>
                <i class="fa-solid fa-video" data-action="reels"></i>
                <i class="fa-regular fa-square-plus" data-action="add"></i>
                <i class="fa-regular fa-user" data-action="profile"></i>
            </nav>
        </div>

        <!-- 3. REELS SCREEN (Overlay or View) -->
        <div id="reels-container" class="app-view">
            <div class="reels-header">
                <h3>Reels</h3>
            </div>
            <div class="reels-feed-scroll" id="reels-feed">
                <!-- Dynamic Reels will load here -->
            </div>
            <nav class="insta-nav">
                <i class="fa-solid fa-house" data-action="home"></i>
                <i class="fa-solid fa-video active" data-action="reels"></i>
                <i class="fa-regular fa-square-plus" data-action="add"></i>
                <i class="fa-regular fa-user" data-action="profile"></i>
            </nav>
        </div>

        <!-- 4. TELEGRAM CHATS LIST SCREEN -->
        <div id="tele-chat-container" class="app-view">
            <header class="top-nav-bar">
                <button class="back-home-btn infinity-btn"><i class="fa-solid fa-arrow-left"></i></button>
                <h2 class="brand-title">Telegram Chats</h2>
                <div></div>
            </header>
            <div class="main-scroll-area" id="tele-chats-list">
                <!-- Dynamic Chat Users will load here -->
            </div>
        </div>

        <!-- 5. INDIVIDUAL CHAT WINDOW SCREEN -->
        <div id="chat-window-screen" class="app-view">
            <header class="top-nav-bar">
                <button id="chat-back-btn" class="back-home-btn"><i class="fa-solid fa-arrow-left"></i></button>
                <h3 id="chat-win-username" style="font-size: 16px;">Username</h3>
                <div></div>
            </header>
            <div class="chat-messages-area" id="chat-messages-area">
                <!-- Messages load here -->
            </div>
            <div class="chat-input-bar">
                <input type="text" id="chat-input-field" placeholder="Write a message...">
                <button id="chat-send-btn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

        <!-- 6. USER PROFILE SCREEN -->
        <div id="user-profile-container" class="app-view">
            <header class="top-nav-bar">
                <h3 id="profile-username-title" style="font-size:16px;">profile</h3>
                <div style="display: flex; gap: 15px; align-items: center;">
                    <i class="fa-solid fa-right-from-bracket logout-icon-btn" title="Logout" style="cursor:pointer; font-size:18px;"></i>
                </div>
            </header>
            <div class="main-scroll-area">
                <div class="profile-header-info">
                    <div class="profile-avatar-large" id="profile-avatar">U</div>
                    <div class="profile-stats-row">
                        <div><b id="profile-posts-count">0</b><span>Posts</span></div>
                        <div><b id="profile-followers-count">0</b><span>Followers</span></div>
                        <div><b id="profile-following-count">0</b><span>Following</span></div>
                    </div>
                </div>
                <div class="profile-action-row">
                    <button id="profile-action-button">Edit Profile</button>
                </div>
                <!-- Profile Tabs -->
                <div class="profile-tabs-bar">
                    <i class="fa-solid fa-table-cells active" id="profile-tab-posts-btn"></i>
                    <i class="fa-solid fa-clapperboard" id="profile-tab-reels-btn" style="color: #777;"></i>
                </div>
                <div class="profile-grid-posts" id="user-profile-posts">
                    <!-- User Posts Grid -->
                </div>
                <div class="profile-grid-reels" id="user-profile-reels" style="display: none;">
                    <!-- User Reels Grid -->
                </div>
            </div>
            <nav class="insta-nav">
                <i class="fa-solid fa-house" data-action="home"></i>
                <i class="fa-solid fa-video" data-action="reels"></i>
                <i class="fa-regular fa-square-plus" data-action="add"></i>
                <i class="fa-regular fa-user active" data-action="profile"></i>
            </nav>
        </div>

        <!-- 7. UPLOAD MODAL SCREEN -->
        <div id="upload-modal" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Create New Post / Reel</h3>
                    <button id="close-upload-modal"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="modal-body">
                    <input type="file" id="upload-file-input" accept="image/*,video/*">
                    <textarea id="upload-caption" placeholder="Write a caption..."></textarea>
                    <button id="submit-upload-btn">Share</button>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
