<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaTele</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="app-wrapper">
        <!-- LOGIN VIEW -->
        <div id="login-view" class="app-view active">
            <div class="login-card">
                <h1 class="logo">InstaTele</h1>
                <input type="text" id="user-inp" placeholder="Phone number, username, or email">
                <input type="password" id="pass-inp" placeholder="Password">
                <button id="login-btn">Log In</button>
                <p id="err-msg"></p>
            </div>
        </div>

        <!-- HOME VIEW -->
        <div id="home-view" class="app-view">
            <header class="header">
                <h2 class="logo-small">InstaTele</h2>
                <button id="logout-btn">Logout</button>
            </header>
            <main class="content">
                <div class="welcome">
                    <h3>Welcome Home!</h3>
                    <p>Login successful.</p>
                </div>
            </main>
            <nav class="footer-nav">
                <i class="icon-placeholder">🏠</i>
                <i class="icon-placeholder">🔍</i>
                <i class="icon-placeholder">➕</i>
                <i class="icon-placeholder">🎬</i>
                <i class="icon-placeholder">👤</i>
            </nav>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
