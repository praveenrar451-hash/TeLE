<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social App Solution</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #0056b3; }
        .chat-box { height: 250px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #fafafa; }
        .message { margin: 5px 0; padding: 8px; border-radius: 4px; max-width: 70%; }
        .incoming { background: #e2e2e2; text-align: left; }
        .outgoing { background: #007bff; color: white; margin-left: auto; text-align: right; }
    </style>
</head>
<body>

    <!-- 1. LOGIN PAGE -->
    <div id="loginPage" class="container">
        <h2>Login</h2>
        <input type="text" id="loginUser" placeholder="Enter Username">
        <input type="password" id="loginPass" placeholder="Enter Password">
        <button onclick="handleLogin()">Log In</button>
    </div>

    <!-- 2. MAIN DASHBOARD (Profile & Chat) -->
    <div id="dashboardPage" class="container hidden">
        <h2>Welcome, <span id="displayUsername">User</span></h2>
        
        <!-- Navigation Buttons -->
        <button onclick="showSection('editProfileSection')">Edit Profile</button>
        <button onclick="showSection('chatSection')">Open Chat</button>
        <button onclick="handleLogout()" style="background: #dc3545;">Logout</button>

        <!-- EDIT PROFILE SECTION -->
        <div id="editProfileSection" class="hidden" style="margin-top: 20px; border-top: 1px solid #ddd; padding-top: 15px;">
            <h3>Edit Profile</h3>
            <label>Change Username (Posts/Reels will remain safe):</label>
            <input type="text" id="newUsernameInput" placeholder="Enter new username">
            
            <label>Profile Picture URL / Upload:</label>
            <input type="text" id="newPicInput" placeholder="Image URL">
            
            <button onclick="saveProfile()">Save Changes</button>
        </div>

        <!-- LIVE CHAT SECTION -->
        <div id="chatSection" class="hidden" style="margin-top: 20px; border-top: 1px solid #ddd; padding-top: 15px;">
            <h3>Live Chat</h3>
            <div id="chatMessages" class="chat-box">
                <!-- Messages will appear here live -->
            </div>
            <input type="text" id="messageInput" placeholder="Type a message...">
            <button onclick="sendMessage()">Send Message</button>
        </div>
    </div>

<script>
    // Local Database Simulation for User Data & Posts Association
    let currentUser = JSON.parse(localStorage.getItem('app_user')) || {
        id: "user_12345", // Fixed ID jisse Posts aur Reels hamesha linked rahengi
        username: "DefaultUser",
        profilePic: "",
        posts: ["Post #1", "Post #2"], // Purani posts jo username badalne par bhi nahi hatengi
        reels: ["Reel #1"]
    };

    // Check login state on load
    if (localStorage.getItem('isLoggedIn') === 'true') {
        loadDashboard();
    }

    // --- LOGIN LOGIC (Fixed Password: 272009 without hint) ---
    function handleLogin() {
        const username = document.getElementById('loginUser').value;
        const password = document.getElementById('loginPass').value;

        if (password === "272009") {
            if(username.trim() !== "") {
                currentUser.username = username;
            }
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('app_user', JSON.stringify(currentUser));
            loadDashboard();
        } else {
            alert("Incorrect Password! Access Denied.");
        }
    }

    function loadDashboard() {
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('dashboardPage').classList.remove('hidden');
        document.getElementById('displayUsername').innerText = currentUser.username;
        document.getElementById('newUsernameInput').value = currentUser.username;
        
        // Start live chat listener simulation
        startLiveChatListener();
    }

    function handleLogout() {
        localStorage.removeItem('isLoggedIn');
        location.reload();
    }

    // Section Switching Helper
    function showSection(sectionId) {
        document.getElementById('editProfileSection').classList.add('hidden');
        document.getElementById('chatSection').classList.add('hidden');
        document.getElementById(sectionId).classList.remove('hidden');
    }

    // --- EDIT PROFILE LOGIC (Updates only username, keeps same ID & Posts) ---
    function saveProfile() {
        const newName = document.getElementById('newUsernameInput').value.trim();
        const newPic = document.getElementById('newPicInput').value.trim();

        if (newName === "") {
            alert("Username cannot be empty!");
            return;
        }

        // Sirf data fields update ki ja rahi hain, ID wahi purani (user_12345) rahegi
        // Isse saari purani posts aur reels automatically usi account me rahengi.
        currentUser.username = newName;
        if(newPic) currentUser.profilePic = newPic;

        localStorage.setItem('app_user', JSON.stringify(currentUser));
        document.getElementById('displayUsername').innerText = currentUser.username;
        
        alert("Profile updated successfully! All your posts and reels remain securely linked to your account.");
    }

    // --- LIVE CHAT LOGIC (Fixing the background/back message delay issue) ---
    function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if(!text) return;

        // Append outgoing message
        appendMessage(text, 'outgoing');
        
        // Save to local storage or send to backend websocket
        let chatHistory = JSON.parse(localStorage.getItem('chat_history')) || [];
        chatHistory.push({ sender: currentUser.username, text: text, type: 'outgoing' });
        localStorage.setItem('chat_history', JSON.stringify(chatHistory));

        input.value = '';

        // Simulate incoming message response automatically for testing live feature
        setTimeout(() => {
            simulateIncomingMessage("Hello! Ye message bina back kiye live update ho raha hai.");
        }, 3000);
    }

    function appendMessage(text, type) {
        const chatBox = document.getElementById('chatMessages');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight; // Auto scroll to bottom
    }

    function simulateIncomingMessage(text) {
        appendMessage(text, 'incoming');
        let chatHistory = JSON.parse(localStorage.getItem('chat_history')) || [];
        chatHistory.push({ sender: "Friend", text: text, type: 'incoming' });
        localStorage.setItem('chat_history', JSON.stringify(chatHistory));
    }

    // Real-time polling / WebSocket listener simulation to fetch messages without going back
    function startLiveChatListener() {
        // Load initial past messages
        const chatBox = document.getElementById('chatMessages');
        chatBox.innerHTML = "";
        let chatHistory = JSON.parse(localStorage.getItem('chat_history')) || [];
        chatHistory.forEach(msg => {
            appendMessage(msg.text, msg.type);
        });

        // Agar aap real backend use kar rahe hain toh yahan Socket.io ya Firebase onSnapshot listener lagega 
        // jo bina page refresh kiye ya back jaye naye messages fetch karega.
    }
<script src="script.js"></script>


</body>
</html>
