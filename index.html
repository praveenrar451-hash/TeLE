<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InstaTele Mixer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- APP CONTAINER -->
    <div id="app-wrapper">

        <!-- 1. LOGIN VIEW -->
        <div id="login-view" class="app-view active">
            <div class="login-container">
                <h1 class="insta-logo">InstaTele</h1>
                <input type="text" id="login-username" placeholder="Username">
                <input type="password" id="login-password" placeholder="Password (272009)">
                <button id="login-btn">Log In</button>
                <p id="login-error" class="error-msg"></p>
            </div>
        </div>

        <!-- 2. INSTA HOME VIEW -->
        <div id="home-view" class="app-view">
            <header class="view-header">
                <h2 class="insta-logo">InstaTele</h2>
                <div class="header-actions">
                    <button id="go-to-tele" class="icon-btn">♾️</button>
                    <button id="logout-btn" class="icon-btn"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </header>
            <main class="scroll-content">
                <div id="stories-tray"></div>
                <div id="main-feed"></div>
            </main>
        </div>

        <!-- 3. EXPLORE VIEW -->
        <div id="explore-view" class="app-view">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="global-search" placeholder="Search posts or users...">
            </div>
            <main class="scroll-content">
                <div id="explore-grid" class="image-grid"></div>
            </main>
        </div>

        <!-- 4. REELS VIEW -->
        <div id="reels-view" class="app-view">
            <header class="reels-header">
                <h2>Reels</h2>
                <button id="upload-reel-trigger"><i class="fa-solid fa-camera"></i></button>
            </header>
            <main id="reels-container" class="snapping-feed"></main>
        </div>

        <!-- 5. TELEGRAM VIEW -->
        <div id="tele-view" class="app-view">
            <header class="tele-header">
                <button id="back-to-insta" class="icon-btn"><i class="fa-solid fa-arrow-left"></i></button>
                <h3>Telegram</h3>
            </header>
            <div class="search-bar tele-style">
                <input type="text" id="user-search" placeholder="Search users...">
            </div>
            <main id="chat-list" class="scroll-content"></main>
        </div>

        <!-- 6. CHAT WINDOW -->
        <div id="chat-window" class="app-view">
            <header class="view-header">
                <button id="close-chat" class="icon-btn"><i class="fa-solid fa-arrow-left"></i></button>
                <div id="active-user-info">
                    <b id="active-chat-name">User</b>
                </div>
            </header>
            <div id="chat-messages" class="scroll-content"></div>
            <div class="chat-input-bar">
                <button id="mic-btn"><i class="fa-solid fa-microphone"></i></button>
                <input type="text" id="msg-input" placeholder="Message...">
                <button id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

        <!-- 7. PROFILE VIEW -->
        <div id="profile-view" class="app-view">
            <header class="view-header">
                <h3 id="profile-title">Profile</h3>
            </header>
            <main class="scroll-content">
                <div class="profile-header">
                    <div id="user-avatar" class="large-avatar"></div>
                    <div class="user-stats">
                        <div class="stat"><b>12</b><span>Posts</span></div>
                        <div class="stat"><b>450</b><span>Followers</span></div>
                    </div>
                </div>
                <div id="profile-posts" class="image-grid"></div>
            </main>
        </div>

        <!-- BOTTOM NAVIGATION -->
        <nav id="bottom-nav">
            <i class="fa-solid fa-house active" data-view="home"></i>
            <i class="fa-solid fa-magnifying-glass" data-view="explore"></i>
            <i class="fa-solid fa-square-plus" id="add-post-btn"></i>
            <i class="fa-solid fa-clapperboard" data-view="reels"></i>
            <i class="fa-solid fa-user" data-view="profile"></i>
        </nav>

        <!-- UPLOAD MODAL -->
        <div id="upload-modal" class="modal-overlay">
            <div class="modal-card">
                <h3>New Post</h3>
                <input type="file" id="file-input" accept="image/*">
                <textarea id="caption-input" placeholder="Write a caption..."></textarea>
                <div class="modal-actions">
                    <button id="share-post-btn">Share</button>
                    <button id="cancel-upload">Cancel</button>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
