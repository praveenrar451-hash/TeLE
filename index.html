<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaTelegram</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app-container">

        <!-- AUTHENTICATION VIEW (Login / Signup) -->
        <div id="auth-container" class="active">
            <h1 class="insta-logo">InstaTelegram</h1>
            
            <!-- Login Box -->
            <div id="login-form-box" style="width: 100%;">
                <input type="email" id="login-email" class="auth-input" placeholder="Email">
                <input type="password" id="login-password" class="auth-input" placeholder="Password">
                <button class="auth-btn" onclick="handleLogin()">Log In</button>
                <div class="auth-switch" onclick="toggleAuthMode(true)">Don't have an account? <span>Sign up</span></div>
            </div>

            <!-- Signup Box -->
            <div id="signup-form-box" style="width: 100%; display: none;">
                <input type="text" id="signup-username" class="auth-input" placeholder="Username">
                <input type="email" id="signup-email" class="auth-input" placeholder="Email">
                <input type="password" id="signup-password" class="auth-input" placeholder="Password">
                <button class="auth-btn" onclick="handleSignup()">Sign Up</button>
                <div class="auth-switch" onclick="toggleAuthMode(false)">Have an account? <span>Log in</span></div>
            </div>
        </div>

        <!-- 1. INSTAGRAM FEED VIEW -->
        <div id="insta-feed-container" class="app-view">
            <div class="top-header">
                <h2>InstaTelegram</h2>
                <div style="display: flex; gap: 15px; font-size: 20px;">
                    <i class="fa-regular fa-square-plus" onclick="openUploadModal()" style="cursor:pointer;"></i>
                    <i class="fa-brands fa-telegram-plane" onclick="switchView('chat-container')" style="cursor:pointer;"></i>
                </div>
            </div>
            <div id="feed-posts-area" style="flex: 1; overflow-y: auto;">
                <!-- Dynamic Posts Here -->
            </div>
        </div>

        <!-- 2. EXPLORE / SEARCH VIEW -->
        <div id="explore-container" class="app-view">
            <div class="top-header">
                <h2>Explore</h2>
            </div>
            <div style="padding: 15px;">
                <input type="text" id="global-user-search" class="auth-input" placeholder="Search user to message..." oninput="searchGlobalUsers(this.value)">
                <div id="search-results-list" style="margin-top: 10px;"></div>
            </div>
        </div>

        <!-- 3. UPLOAD POST VIEW / MODAL -->
        <div id="upload-modal" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:300; justify-content:center; align-items:center; padding:20px;">
            <div style="background:#121212; padding:20px; border-radius:10px; width:100%; max-width:400px; border:1px solid #262626;">
                <h3 style="margin-bottom:15px;">Create New Post</h3>
                <input type="text" id="upload-image-url" class="auth-input" placeholder="Image URL">
                <input type="text" id="upload-caption-text" class="auth-input" placeholder="Write a caption...">
                <button class="auth-btn" onclick="submitNewPost()">Share Post</button>
                <button class="auth-btn" style="background:#444; margin-top:5px;" onclick="closeUploadModal()">Cancel</button>
            </div>
        </div>

        <!-- 4. TELEGRAM CHAT LIST VIEW -->
        <div id="chat-container" class="app-view">
            <div class="top-header">
                <h2>Chats</h2>
                <i class="fa-solid fa-magnifying-glass" onclick="switchView('explore-container')" style="cursor:pointer;"></i>
            </div>
            <div id="chat-users-list" style="flex:1; overflow-y:auto;">
                <!-- Active Chats Here -->
            </div>

            <!-- Active Chat Conversation Window -->
            <div id="active-chat-window" style="display:none; flex-direction:column; position:absolute; top:0; left:0; width:100%; height:100%; background:#000; z-index:250;">
                <div class="top-header">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <i class="fa-solid fa-arrow-left" onclick="closeChatWindow()" style="cursor:pointer;"></i>
                        <span id="active-chat-username" style="font-weight:bold;"></span>
                    </div>
                </div>
                <div id="chat-messages-list" class="chat-messages-box" style="flex:1; overflow-y:auto; padding:15px; display:flex; flexDirection:column; gap:10px;"></div>
                <div class="chat-input-bar">
                    <input type="text" id="chat-message-input" placeholder="Message...">
                    <button onclick="sendDirectMessage()">Send</button>
                </div>
            </div>
        </div>

    - 5. PROFILE VIEW (Instagram Style) -->
<div id="profile-container" class="app-view">
    <div class="top-header">
        <h2 id="profile-display-name">username</h2>
        <div style="display: flex; gap: 15px; align-items: center; font-size: 20px;">
            <i class="fa-solid fa-gear" onclick="alert('Settings & Privacy')" style="cursor:pointer; font-size: 18px;"></i>
            <i class="fa-solid fa-right-from-bracket" onclick="handleLogout()" style="cursor:pointer; color:#ed4956; font-size: 18px;"></i>
        </div>
    </div>

    <!-- Profile Header Info -->
    <div style="padding: 15px 16px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <div id="my-profile-avatar" class="avatar" style="width: 80px; height: 80px; font-size: 30px;">U</div>
            <div style="display: flex; gap: 20px; text-align: center; flex: 1; justify-content: space-around; margin-left: 15px;">
                <div>
                    <b id="profile-posts-count" style="font-size: 16px;">0</b>
                    <p style="font-size: 12px; color: #aaa;">Posts</p>
                </div>
                <div>
                    <b style="font-size: 16px;">142</b>
                    <p style="font-size: 12px; color: #aaa;">Followers</p>
                </div>
                <div>
                    <b style="font-size: 16px;">85</b>
                    <p style="font-size: 12px; color: #aaa;">Following</p>
                </div>
            </div>
        </div>

        <!-- Bio Section -->
        <div style="margin-top: 12px;">
            <b id="my-profile-username" style="font-size: 14px;">username</b>
            <p id="profile-bio-text" style="font-size: 13px; color: #ddd; margin-top: 2px;">Building InstaTelegram 🚀 | CSE Student 💻</p>
        </div>

        <!-- Profile Action Buttons -->
        <div style="display: flex; gap: 8px; margin-top: 15px;">
            <button onclick="editProfileBio()" style="flex: 1; background: #262626; color: #fff; border: none; padding: 7px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer;">Edit Profile</button>
            <button onclick="alert('Profile Link Copied!')" style="flex: 1; background: #262626; color: #fff; border: none; padding: 7px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer;">Share Profile</button>
        </div>
    </div>

    <!-- Profile Posts Grid Tabs -->
    <div style="display: flex; border-top: 1px solid #262626; border-bottom: 1px solid #262626; margin-top: 10px;">
        <div style="flex: 1; text-align: center; padding: 10px; border-bottom: 1.5px solid #fff; font-size: 16px;"><i class="fa-solid fa-table-cells"></i></div>
        <div style="flex: 1; text-align: center; padding: 10px; color: #777; font-size: 16px;"><i class="fa-solid fa-bookmark"></i></div>
    </div>

    <!-- User Grid Posts Area -->
    <div id="my-profile-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: #000; flex: 1;">
        <!-- User posts will load here in grid format -->
    </div>
</div>

        <!-- INSTAGRAM BOTTOM NAVIGATION BAR -->
        <div class="bottom-nav" id="main-bottom-nav">
            <i class="fa-solid fa-house" onclick="switchView('insta-feed-container')"></i>
            <i class="fa-solid fa-compass" onclick="switchView('explore-container')"></i>
            <i class="fa-regular fa-square-plus" onclick="openUploadModal()"></i>
            <i class="fa-regular fa-comment-dots" onclick="switchView('chat-container')"></i>
            <i class="fa-solid fa-user" onclick="switchView('profile-container')"></i>
        </div>

    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
