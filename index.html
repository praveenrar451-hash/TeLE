<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app-container">

        <!-- AUTH LOGIN SCREEN -->
        <div id="auth-container" class="app-view active">
            <div class="auth-box">
                <h1 class="insta-logo">Instagram</h1>
                <input type="text" id="auth-username" placeholder="Username" class="insta-input">
                <input type="password" id="auth-password" placeholder="Password" class="insta-input">
                <button onclick="handleAuthLogin()" class="insta-main-btn">Log in</button>
            </div>
        </div>

        <!-- MAIN APP -->
        <div id="main-app-content" style="display: none; height: 100%;">
            
            <!-- VIEW 1: HOME FEED -->
            <div id="insta-feed-container" class="app-view active-view">
                <div class="top-header">
                    <span class="insta-logo" style="font-size: 22px; margin:0;">Instagram</span>
                    <div class="header-icons">
                        <i class="fa-regular fa-heart" onclick="switchView('notifications-container')"></i>
                        <i class="fa-regular fa-paper-plane" onclick="switchView('chat-container')"></i>
                    </div>
                </div>
                <!-- Stories Tray -->
                <div class="stories-tray">
                    <div class="story-item">
                        <div class="story-ring"><div id="feed-story-avatar" class="avatar" style="width: 56px; height: 56px;">U</div></div>
                        <span>Your story</span>
                    </div>
                </div>
                <div id="feed-posts-list"></div>
            </div>

            <!-- VIEW 2: EXPLORE / SEARCH -->
            <div id="explore-container" class="app-view">
                <div class="search-bar-wrapper">
                    <i class="fa-solid fa-magnifying-glass" style="color: #8e8e8e;"></i>
                    <input type="text" id="search-users-input" placeholder="Search" oninput="handleUserSearch(this.value)">
                </div>
                <div id="search-results-list"></div>
            </div>

            <!-- VIEW 3: CREATE POST -->
            <div id="create-container" class="app-view" style="padding: 16px;">
                <div class="top-header" style="position:relative; border:none; padding:0 0 15px 0;">
                    <b style="font-size: 16px;">Create new post</b>
                </div>
                <input type="text" id="create-img-url" placeholder="Paste Image URL..." class="insta-input">
                <textarea id="create-caption" placeholder="Write a caption..." class="insta-input" style="height: 100px; resize: none;"></textarea>
                <button onclick="submitNewPost()" class="insta-main-btn">Share</button>
            </div>

            <!-- VIEW 4: NOTIFICATIONS -->
            <div id="notifications-container" class="app-view">
                <div class="top-header"><b style="font-size:16px;">Notifications</b></div>
                <div style="padding: 20px; color: #8e8e8e; text-align: center;">No notifications yet</div>
            </div>

            <!-- VIEW 5: CHAT -->
            <div id="chat-container" class="app-view">
                <div class="top-header"><b style="font-size:16px;">Messages</b></div>
                <div id="chat-users-list"></div>
            </div>

            <!-- VIEW 6: MY PROFILE -->
            <div id="profile-container" class="app-view">
                <div class="top-header">
                    <b id="top-profile-username" style="font-size: 18px;">username</b>
                    <i class="fa-solid fa-bars" style="font-size: 20px; cursor:pointer;" onclick="handleLogout()"></i>
                </div>
                <div class="profile-header">
                    <div style="position: relative; width: 80px; height: 80px;">
                        <div id="my-profile-avatar" class="avatar" style="width: 80px; height: 80px; font-size: 28px;">U</div>
                        <div onclick="document.getElementById('hidden-file-input').click()" class="profile-pencil-badge">
                            <i class="fa-solid fa-plus" style="font-size: 10px; color: #fff;"></i>
                        </div>
                        <input type="file" id="hidden-file-input" accept="image/*" style="display: none;" onchange="handleProfilePicUpload(event)">
                    </div>
                    <div class="profile-stats">
                        <div><b id="profile-posts-count">0</b><span>posts</span></div>
                        <div><b id="profile-followers-count">0</b><span>followers</span></div>
                        <div><b id="profile-following-count">0</b><span>following</span></div>
                    </div>
                </div>
                <div class="profile-bio">
                    <b id="my-profile-display-name">username</b>
                    <p id="profile-bio-text">Digital Creator</p>
                </div>
                <div class="profile-action-btns">
                    <button onclick="openEditProfileModal()">Edit profile</button>
                    <button onclick="alert('Share profile link copied!')">Share profile</button>
                </div>
                <div class="profile-tabs">
                    <div class="active-tab"><i class="fa-solid fa-table-cells"></i></div>
                    <div><i class="fa-solid fa-bookmark"></i></div>
                </div>
                <div id="my-profile-grid" class="profile-grid"></div>
            </div>

            <!-- INSTAGRAM BOTTOM NAVIGATION -->
            <div class="bottom-nav">
                <i class="fa-solid fa-house active" onclick="switchView('insta-feed-container')"></i>
                <i class="fa-solid fa-magnifying-glass" onclick="switchView('explore-container')"></i>
                <i class="fa-regular fa-square-plus" onclick="switchView('create-container')"></i>
                <i class="fa-solid fa-clapperboard" onclick="switchView('explore-container')"></i>
                <div class="nav-avatar-icon" onclick="switchView('profile-container')">
                    <div id="nav-mini-avatar" class="avatar" style="width: 24px; height: 24px; font-size: 10px;">U</div>
                </div>
            </div>

        </div>
    </div>

    <!-- EDIT PROFILE ROUNDED POPUP MODAL -->
    <div id="edit-profile-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:2000; justify-content:center; align-items:center;">
        <div style="background:#262626; width:90%; max-width:340px; padding:20px; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,0.5);">
            <h3 style="margin-bottom:15px; font-size:16px; text-align:center;">Edit Profile</h3>
            <label style="font-size:12px; color:#8e8e8e;">Username</label>
            <input type="text" id="edit-username-input" class="insta-input" style="margin-top:4px; margin-bottom:12px;">
            <label style="font-size:12px; color:#8e8e8e;">Bio</label>
            <textarea id="edit-bio-input" class="insta-input" style="margin-top:4px; margin-bottom:15px; height:70px; resize:none;"></textarea>
            <div style="display:flex; gap:10px;">
                <button onclick="closeEditProfileModal()" style="flex:1; background:#363636; border:none; color:#fff; padding:10px; border-radius:8px; font-weight:600; cursor:pointer;">Cancel</button>
                <button onclick="saveProfileChanges()" style="flex:1; background:#0095f6; border:none; color:#fff; padding:10px; border-radius:8px; font-weight:600; cursor:pointer;">Save</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
