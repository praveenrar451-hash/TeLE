<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaTELE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    html, body { background-color: #000; color: #fff; width: 100%; height: 100%; overflow: hidden; display: flex; justify-content: center; }
    
    #app-wrapper { width: 100%; max-width: 480px; height: 100%; background: #000; display: flex; flex-direction: column; position: relative; }
    
    /* Auth Container */
    #auth-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
    #auth-container.active { display: flex; }
    .auth-box { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; }
    .auth-box input { background: #121212; border: 1px solid #363636; padding: 12px; border-radius: 6px; color: #fff; outline: none; font-size: 14px; }
    .auth-box button { background: #0095f6; border: none; padding: 12px; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; font-size: 14px; }

    /* Main Content Container */
    #main-app-content { display: none; flex-direction: column; flex: 1; width: 100%; overflow: hidden; position: relative; }
    
    /* Standard Views */
    .app-view { display: none; flex: 1; flex-direction: column; background: #000; overflow-y: auto; width: 100%; height: 100%; }
    .app-view.active-view { display: flex; }

    /* Special override for Chatroom so it doesn't break */
    #chatroom-container { display: none; flex-direction: column; flex: 1; width: 100%; height: 100%; background: #000; }
    #chatroom-container.active-view { display: flex !important; }

    /* Top Bar */
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid #262626; background: #000; width: 100%; z-index: 10; flex-shrink: 0; }
    .logo-text { font-family: cursive; font-size: 22px; font-weight: bold; }
    .top-icons { display: flex; gap: 20px; font-size: 20px; align-items: center; }

    /* Bottom Nav */
    .bottom-nav { width: 100%; height: 50px; min-height: 50px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #262626; background: #000; z-index: 100; flex-shrink: 0; }
    .bottom-nav i { font-size: 22px; cursor: pointer; color: #fff; }

    /* Avatar */
    .avatar { border-radius: 50%; background-size: cover; background-position: center; display: flex; justify-content: center; align-items: center; background-color: #363636; color: #fff; font-weight: bold; flex-shrink: 0; }

    /* Feed & Post Cards */
    .post-card { display: flex; flex-direction: column; margin-bottom: 16px; border-bottom: 1px solid #1a1a1a; }
    .post-header { display: flex; align-items: center; padding: 10px 12px; gap: 10px; }
    .post-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #121212; }
    .post-actions { display: flex; justify-content: space-between; padding: 10px 12px; font-size: 20px; }
    .post-details { padding: 0 12px 10px 12px; font-size: 14px; }
    </style>
</head>
<body>

    <div id="app-wrapper">
        
        <div id="auth-container" class="active">
            <div class="auth-box">
                <h2 style="text-align:center; font-family:cursive; margin-bottom:20px;">InstaTELE</h2>
                <input type="text" id="auth-username" placeholder="Enter Username">
                <button onclick="handleAuthLogin()">Log In</button>
            </div>
        </div>

        <div id="main-app-content">

            <div id="insta-feed-container" class="app-view active-view">
                <div class="top-bar">
                    <span class="logo-text">InstaTELE</span>
                    <div class="top-icons">
                        <i class="fa-regular fa-heart" onclick="openSwitchAccountModal()"></i>
                        <i class="fa-regular fa-paper-plane" onclick="openChatList()"></i>
                    </div>
                </div>
                <div style="flex:1; overflow-y:auto;" id="feed-posts-list">
                    </div>
            </div>

            <div id="explore-container" class="app-view">
                <div style="padding: 10px 16px; border-bottom: 1px solid #262626;">
                    <input type="text" id="search-input" placeholder="Search users..." oninput="handleUserSearch(this.value)" style="width:100%; background:#262626; border:none; padding:8px 12px; border-radius:8px; color:#fff; outline:none;">
                </div>
                <div id="search-results-list" style="flex:1; overflow-y:auto; padding: 10px 16px;"></div>
            </div>

            <div id="create-container" class="app-view" style="padding: 20px; flex-direction:column; align-items:center;">
                <div class="top-bar" style="width:100%; margin-bottom:20px;">
                    <i class="fa-solid fa-arrow-left" style="cursor:pointer;" onclick="switchView('insta-feed-container')"></i>
                    <b>Create New Post</b>
                    <div></div>
                </div>
                <div style="width:100%; max-width:400px; display:flex; flex-direction:column; gap:16px;">
                    <input type="file" id="post-file-input" accept="image/*" style="display:none;" onchange="previewSelectedImage(event)">
                    
                    <div id="post-preview-box" onclick="document.getElementById('post-file-input').click()" style="width:100%; aspect-ratio:1/1; background:#121212; border:2px dashed #363636; border-radius:12px; display:flex; flex-direction:column; justify-content:center; align-items:center; cursor:pointer; overflow:hidden; position:relative;">
                        <i class="fa-solid fa-cloud-arrow-up" style="font-size:36px; color:#8e8e8e; margin-bottom:10px;"></i>
                        <span style="color:#8e8e8e; font-size:14px;">Tap to select photo from gallery</span>
                    </div>

                    <textarea id="create-caption" placeholder="Write a caption..." style="width:100%; height:80px; background:#121212; border:1px solid #363636; border-radius:8px; padding:12px; color:#fff; outline:none; font-size:14px; resize:none;"></textarea>
                    
                    <button onclick="submitNewPost()" style="width:100%; background:#0095f6; border:none; padding:12px; border-radius:8px; color:#fff; font-weight:bold; font-size:14px; cursor:pointer;">Share Post</button>
                </div>
            </div>

            <div id="reels-container" class="app-view">
                </div>

            <div id="profile-container" class="app-view">
                <div class="top-bar">
                    <b id="top-profile-username" style="font-size: 16px;">username</b>
                    <i class="fa-solid fa-bars" onclick="openSwitchAccountModal()"></i>
                </div>
                <div style="padding: 16px; display:flex; align-items:center; gap:20px;">
                    <label for="profile-pic-file" style="cursor:pointer;">
                        <div id="my-profile-avatar" class="avatar" style="width:74px; height:74px; font-size:26px;">U</div>
                    </label>
                    <input type="file" id="profile-pic-file" accept="image/*" style="display:none;" onchange="handleProfilePicUpload(event)">
                    <div style="display:flex; justify-content:space-around; flex:1; text-align:center;">
                        <div>
                            <b id="profile-posts-count" style="display:block; font-size:16px;">0</b>
                            <span style="font-size:12px; color:#8e8e8e;">posts</span>
                        </div>
                        <div style="cursor:pointer;">
                            <b id="profile-followers-count" style="display:block; font-size:16px;">0</b>
                            <span style="font-size:12px; color:#8e8e8e;">followers</span>
                        </div>
                        <div style="cursor:pointer;">
                            <b id="profile-following-count" style="display:block; font-size:16px;">0</b>
                            <span style="font-size:12px; color:#8e8e8e;">following</span>
                        </div>
                    </div>
                </div>
                <div style="padding: 0 16px 12px 16px;">
                    <b id="my-profile-display-name" style="font-size:14px; display:block;">Name</b>
                    <span id="profile-bio-text" style="font-size:13px; color:#ccc; display:block; margin-top:2px;">Digital Creator</span>
                </div>
                <div style="padding: 0 16px 15px 16px; display:flex; gap:8px;">
                    <button onclick="openEditProfileModal()" style="flex:1; background:#262626; border:none; color:#fff; padding:6px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:13px;">Edit Profile</button>
                </div>
                <div id="my-profile-grid" style="display:grid; grid-template-columns: repeat(3, 1fr); gap:2px; flex:1; overflow-y:auto;"></div>
            </div>

            <div id="user-profile-container" class="app-view">
                <div class="top-bar">
                    <i class="fa-solid fa-arrow-left" style="cursor:pointer;" onclick="switchView('explore-container')"></i>
                    <b id="other-profile-username-top" style="font-size: 16px;">username</b>
                    <div></div>
                </div>
                <div style="padding: 16px; display:flex; align-items:center; gap:20px;">
                    <div id="other-profile-avatar" class="avatar" style="width:74px; height:74px; font-size:26px;">U</div>
                    <div style="display:flex; justify-content:space-around; flex:1; text-align:center;">
                        <div>
                            <b id="other-profile-posts-count" style="display:block; font-size:16px;">0</b>
                            <span style="font-size:12px; color:#8e8e8e;">posts</span>
                        </div>
                        <div style="cursor:pointer;">
                            <b id="other-profile-followers-count" style="display:block; font-size:16px;">0</b>
                            <span style="font-size:12px; color:#8e8e8e;">followers</span>
                        </div>
                        <div style="cursor:pointer;">
                            <b id="other-profile-following-count" style="display:block; font-size:16px;">0</b>
                            <span style="font-size:12px; color:#8e8e8e;">following</span>
                        </div>
                    </div>
                </div>
                <div style="padding: 0 16px 12px 16px;">
                    <b id="other-profile-display-name" style="font-size:14px; display:block;">Name</b>
                    <span id="other-profile-bio-text" style="font-size:13px; color:#ccc; display:block; margin-top:2px;">Digital Creator</span>
                </div>
                <div style="padding: 0 16px 15px 16px; display:flex; gap:8px;">
                    <button id="other-follow-btn" onclick="toggleFollowUser()" style="flex:1; background:#0095f6; border:none; color:#fff; padding:6px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:13px;">Follow</button>
                    <button onclick="openChatWithUser()" style="flex:1; background:#262626; border:none; color:#fff; padding:6px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:13px;">Message</button>
                </div>
                <div id="other-profile-grid" style="display:grid; grid-template-columns: repeat(3, 1fr); gap:2px; flex:1; overflow-y:auto;"></div>
            </div>

            <div id="chat-container" class="app-view">
                <div class="top-bar">
                    <i class="fa-solid fa-arrow-left" style="cursor:pointer;" onclick="switchView('insta-feed-container')"></i>
                    <b>Messages</b>
                    <div></div>
                </div>
                <div id="chat-users-list" style="flex:1; overflow-y:auto;"></div>
            </div>

            <div id="chatroom-container" class="app-view" style="display:none; flex-direction:column; height:100%;">
                <div class="top-bar" style="display:flex; align-items:center;">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <i class="fa-solid fa-arrow-left" style="cursor:pointer;" onclick="switchView('chat-container')"></i>
                        <div id="chatroom-avatar" class="avatar" style="width:32px; height:32px; font-size:12px;">U</div>
                        <div>
                            <b id="chatroom-title" style="font-size:14px; display:block;">Chat</b>
                        </div>
                    </div>
                    <div style="display:flex; gap:16px; align-items:center;">
                        <i class="fa-solid fa-phone" style="cursor:pointer; color:#0095f6; font-size:16px;" onclick="startAudioCall()" title="Audio Call"></i>
                        <i class="fa-solid fa-video" style="cursor:pointer; color:#0095f6; font-size:18px;" onclick="startVideoCall()" title="Video Call"></i>
                    </div>
                </div>
                <div id="chatroom-messages" style="flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px;"></div>
                <div style="display:flex; align-items:center; padding:10px; border-top:1px solid #262626; background:#000; gap:10px;">
                    <label for="chat-photo-input" style="cursor:pointer; color:#0095f6; font-size:18px;">
                        <i class="fa-regular fa-image"></i>
                    </label>
                    <input type="file" id="chat-photo-input" accept="image/*" style="display:none;" onchange="sendChatPhoto(event)">
                    <i class="fa-solid fa-microphone" style="cursor:pointer; color:#0095f6; font-size:18px;" onclick="recordVoiceNote()" title="Voice Note"></i>
                    <input type="text" id="chatroom-input" placeholder="Message..." style="flex:1; background:#262626; border:none; padding:10px 14px; border-radius:20px; color:#fff; outline:none; font-size:14px;">
                    <button onclick="sendChatMessage()" style="background:#0095f6; border:none; color:#fff; padding:8px 16px; border-radius:20px; font-weight:bold; cursor:pointer;">Send</button>
                </div>
            </div>

            <div id="edit-profile-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center;">
                <div style="background:#262626; width:90%; max-width:320px; padding:20px; border-radius:12px; display:flex; flex-direction:column; gap:12px;">
                    <b>Edit Profile</b>
                    <input type="text" id="edit-username-input" placeholder="Username" style="background:#121212; border:1px solid #363636; padding:10px; border-radius:6px; color:#fff; outline:none;">
                    <input type="text" id="edit-bio-input" placeholder="Bio" style="background:#121212; border:1px solid #363636; padding:10px; border-radius:6px; color:#fff; outline:none;">
                    <div style="display:flex; gap:10px; margin-top:5px;">
                        <button onclick="saveProfileChanges()" style="flex:1; background:#0095f6; border:none; padding:8px; border-radius:6px; color:#fff; cursor:pointer; font-weight:bold;">Save</button>
                        <button onclick="closeEditProfileModal()" style="flex:1; background:#363636; border:none; padding:8px; border-radius:6px; color:#fff; cursor:pointer;">Cancel</button>
                    </div>
                </div>
            </div>

            <div id="switch-account-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center;">
                <div style="background:#262626; width:90%; max-width:320px; padding:20px; border-radius:12px; display:flex; flex-direction:column; gap:12px;">
                    <b>Switch / Add Account</b>
                    <div id="saved-accounts-list" style="display:flex; flex-direction:column; gap:8px; max-height:150px; overflow-y:auto;"></div>
                    <input type="text" id="new-switch-username" placeholder="Add new username" style="background:#121212; border:1px solid #363636; padding:10px; border-radius:6px; color:#fff; outline:none;">
                    <div style="display:flex; gap:10px;">
                        <button onclick="addAndSwitchAccount()" style="flex:1; background:#0095f6; border:none; padding:8px; border-radius:6px; color:#fff; cursor:pointer; font-weight:bold;">Add & Switch</button>
                        <button onclick="closeSwitchAccountModal()" style="flex:1; background:#363636; border:none; padding:8px; border-radius:6px; color:#fff; cursor:pointer;">Close</button>
                    </div>
                </div>
            </div>

            <div class="bottom-nav">
                <i class="fa-solid fa-house" onclick="switchView('insta-feed-container')"></i>
                <i class="fa-solid fa-magnifying-glass" onclick="switchView('explore-container')"></i>
                <i class="fa-regular fa-square-plus" onclick="switchView('create-container')"></i>
                <i class="fa-solid fa-clapperboard" onclick="switchView('reels-container')"></i>
                <div id="nav-mini-avatar" class="avatar" style="width:26px; height:26px; font-size:11px; cursor:pointer;" onclick="switchView('profile-container')">U</div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
